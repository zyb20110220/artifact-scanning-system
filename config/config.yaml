# 全局配置模板（阶段 1 起逐步填充）
# 敏感信息（API Key、数据库密码）请放入 secret.yaml / .env，不入库

# ---------- 数据 ----------
data:
  raw_dir: data/raw
  feature_dir: data/features
  kg_dir: data/kg
  image_max_side: 1024        # 图片最长边
  target_categories:          # 目标文物类别（MET）
    - Ceramics
    - Metalwork
    - Sculpture
  max_objects: 50000          # 采集上限
  met_api_base: "https://collectionapi.metmuseum.org/public/collection/v1"
  wikidata_sparql_endpoint: "https://query.wikidata.org/sparql"
  department_ids: [6, 12, 13]   # 亚洲&希腊罗马&中世纪艺术（方案A备用）
  search_keywords: ["pottery", "vase", "bowl", "bronze", "jade", "porcelain", "ceramic", "sculpture", "figurine", "celadon", "earthenware", "stoneware", "vessel", "jar", "urn", "statue", "coin", "mirror", "pot", "jug", "cup", "plate", "dish", "amphora", "teapot", "incense", "censer", "bead", "pendant", "ring", "amulet", "seal", "lamp", "statuette", "relief", "sarcophagus", "ushebti"]   # 方案B：关键词搜索（扩充陶瓷/青铜相关）
  medium_keywords: ["Ceramic", "Bronze", "Jade", "Pottery", "Porcelain", "Stoneware", "Earthenware", "Celadon", "Copper", "Silver", "Ivory", "Terracotta"]

# ---------- 特征提取 ----------
features:
  dinov2_model: "facebook/dinov2-base"      # 768 维
  clip_model: "openai/clip-vit-base-patch32" # 512 维（与 DINOv2 拼接成 1280 维混合特征）
  hybrid: true                              # true=用 DINOv2+CLIP 混合特征；false=仅 DINOv2
  feature_file: data/features/hybrid_features.npy   # 混合特征 npy（Rerank 精排用）
  batch_size: 16                            # CPU 推理调小 batch，避免内存暴涨
  device: cpu                               # 无 GPU，CPU 推理

# ---------- 向量检索 ----------
retrieval:
  index_type: HNSW             # HNSW / IVF
  hnsw_m: 32                   # HNSW 邻居数
  metric: ip                   # l2 / ip（向量已归一化，ip=余弦相似度，分数可直接当相似度）
  top_k: 5
  index_path: data/features/hybrid_hnsw.index
  id_map_path: data/features/id_map.json
  rerank: true               # 两阶段精排：粗筛 Top-N → 高 CLIP 权重精排 → Top-K
  rerank_top_n: 50           # 粗筛候选数
  rerank_wd: 0.2             # 精排 DINOv2 权重
  rerank_wc: 1.0             # 精排 CLIP 权重

# ---------- 知识图谱 ----------
kg:
  uri: "bolt://neo4j:7687"   # Docker 容器内用服务名通信；本机直接运行时改回 bolt://localhost:7687
  user: "neo4j"
  database: "neo4j"

# ---------- 多模态 LLM ----------
# 无 GPU：优先走云端 API（推荐）；本地 CPU 推理极慢，仅作进阶
llm:
  mode: api                     # api（云端）/ local（本地）
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 阿里百炼 OpenAI 兼容端点
  api_key_env: "QWEN_API_KEY"   # API Key 从环境变量读取，不写入本文件
  model: "qwen-vl-max"          # 云端模型名
  # ---- 本地模式（可选，仅当有 GPU 或接受极慢速度）----
  # model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  # load_in_4bit: false          # CPU 不支持 4bit 量化
  max_new_tokens: 1024
  temperature: 0.3

# ---------- 微调 (LoRA) ----------
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  gradient_checkpointing: true
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 3
  data_path: "data/train/train_data.jsonl"

# ---------- 前端 ----------
app:
  host: "0.0.0.0"
  port: 7860

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "7860:7860"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      QWEN_API_KEY: "${QWEN_API_KEY}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      # 容器内访问 HuggingFace / 外网走宿主机代理（host.docker.internal 指向宿主机）
      HTTP_PROXY: "http://host.docker.internal:7897"
      HTTPS_PROXY: "http://host.docker.internal:7897"
      NO_PROXY: "localhost,127.0.0.1,neo4j"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts # 开发期挂载代码，改动即时生效（免重建镜像）
      - ./config:/app/config
      - ./src:/app/src

volumes:
  neo4j_data:

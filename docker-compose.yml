services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "7860:7860"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      QWEN_API_KEY: "${QWEN_API_KEY}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
    volumes:
      - ./data:/app/data

volumes:
  neo4j_data:
